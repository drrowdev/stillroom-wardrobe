project_id = "stillroom-wardrobe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "500KiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 24

[auth.email]
# The CLI maps this to GOTRUE_EXTERNAL_EMAIL_ENABLED: the whole email provider,
# including password sign-in and recovery/OTP/magic links subject to configuration
# and delivery prerequisites, not a password-only switch. Phase 0 has password UI
# only; detectSessionInUrl=false does not disable backend email endpoints.
# Inbucket is disabled: no mail delivery or completed recovery is claimed.
# [auth] enable_signup=false, anonymous-sign-in denial and admission/RLS remain.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
