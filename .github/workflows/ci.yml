name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:translations
      - run: npm run test:unit
      - name: Set a build-only secret canary
        run: echo "STILLROOM_SECRET_CANARY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run scan:secrets
      - run: npm run check:dependencies
      - run: npx playwright install --with-deps chromium webkit
      - id: browser_baseline
        run: npm run test:browser
      - name: Preserve bounded synthetic I06 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i06-profile-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i06-visual/profile-en-desktop.png
            test-results/i06-visual/profile-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I07 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i07-capture-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i07-visual/crop-en-desktop.png
            test-results/i07-visual/crop-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I29b visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i29b-item-details-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i29b-visual/item-details-en-desktop.png
            test-results/i29b-visual/item-details-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I29c visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i29c-garment-fields-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i29c-visual/garment-fields-en-desktop.png
            test-results/i29c-visual/garment-fields-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I29 photo-first C visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i29-photo-first-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i29-photo-first-visual/consent-en-desktop.png
            test-results/i29-photo-first-visual/consent-fi-mobile.png
            test-results/i29-photo-first-visual/analyzed-draft-en-desktop.png
            test-results/i29-photo-first-visual/analyzed-draft-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic UX-copy visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-copy-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/ux-copy-visual/sign-in-en-desktop.png
            test-results/ux-copy-visual/sign-in-fi-mobile.png
            test-results/ux-copy-visual/recovery-en-desktop.png
            test-results/ux-copy-visual/recovery-fi-mobile.png
            test-results/ux-copy-visual/wardrobe-empty-en-desktop.png
            test-results/ux-copy-visual/wardrobe-empty-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I08 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i08-item-lifecycle-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i08-visual/trash-en-desktop.png
            test-results/i08-visual/trash-fi-mobile.png
            test-results/i08-visual/delete-en-desktop.png
            test-results/i08-visual/delete-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I09 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i09-wardrobe-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i09-visual/wardrobe-grid-en-desktop.png
            test-results/i09-visual/wardrobe-filters-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Temporary PR30 Linux analysis transport probe
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
              github.event.pull_request.number == 30 && github.run_attempt == '1' &&
              (steps.browser_baseline.outcome == 'success' || steps.browser_baseline.outcome == 'failure') }}
        timeout-minutes: 3
        env:
          STILLROOM_LINUX_WIRE_PROBE: pr30-linux-wire-once-v1
          PLAYWRIGHT_PORT: '5297'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync, execFileSync } from 'node:child_process';
          import { createServer } from 'node:net';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          import { webkit as browserType } from './node_modules/playwright/index.mjs';

          const started = Date.now();
          const cli = path.resolve('node_modules/@playwright/test/cli.js');
          const args = ['test', 'ai-photo-first[.]spec[.]ts$', '--project=webkit-photo',
            '--grep', 'raw-analysis linux differential', '--workers=2', '--retries=0'];
          const names = ['A-retargeted', 'B-plain-continue', 'C-direct'];
          function validateSelection(report) {
            assert.deepEqual(report.errors, []);
            assert.equal(report.config.workers, 2);
            const projects = report.config.projects.filter(project => project.name === 'webkit-photo');
            assert.equal(projects.length, 1);
            assert.equal(projects[0].retries, 0);
            assert.equal(projects[0].repeatEach, 1);
            assert.equal(report.suites.length, 1);
            const file = report.suites[0];
            assert.equal(file.file, 'ai-photo-first.spec.ts');
            assert.deepEqual(file.specs, []);
            assert.equal(file.suites.length, 1);
            const suite = file.suites[0];
            assert.equal(suite.title, 'raw-analysis linux differential');
            assert.equal(suite.file, file.file);
            assert.equal((suite.suites ?? []).length, 0);
            assert.deepEqual(suite.specs.map(spec => spec.title).sort(), names);
            for (const spec of suite.specs) {
              assert.equal(spec.file, file.file);
              assert.equal(spec.tests.length, 1);
              const test = spec.tests[0];
              assert.equal(test.projectName, 'webkit-photo');
              assert.equal(test.expectedStatus, 'passed');
              assert.deepEqual(test.results, []);
              assert.ok(!test.annotations.some(annotation =>
                ['skip', 'fixme', 'fail'].includes(annotation.type)));
            }
          }
          async function requireClosed(port) {
            await new Promise((resolve, reject) => {
              const server = createServer();
              const timer = setTimeout(() => reject(new Error('Probe port check timed out.')), 2000);
              server.once('error', () => { clearTimeout(timer); reject(new Error('Probe port is occupied.')); });
              server.listen({ host: '127.0.0.1', port, exclusive: true }, () => {
                server.close(error => {
                  clearTimeout(timer);
                  if (error) reject(error);
                  else resolve();
                });
              });
            });
          }
          function checkedGit(...args) {
            return execFileSync('git', args, { encoding: 'utf8', timeout: 2000, maxBuffer: 1024 }).trim();
          }
          assert.equal(process.platform, 'linux');
          assert.equal(process.version, 'v' + readFileSync('.node-version', 'utf8').trim());
          assert.equal(process.env.STILLROOM_LINUX_WIRE_PROBE, 'pr30-linux-wire-once-v1');
          assert.equal(process.env.PLAYWRIGHT_PORT, '5297');
          for (const key of ['PLAYWRIGHT_JSON_OUTPUT_FILE', 'PLAYWRIGHT_JSON_OUTPUT_NAME', 'PLAYWRIGHT_JSON_OUTPUT_DIR']) {
            assert.equal(process.env[key], undefined);
          }
          const version = JSON.parse(readFileSync('node_modules/playwright-core/package.json', 'utf8')).version;
          assert.equal(version, '1.63.0');
          const webkit = JSON.parse(readFileSync('node_modules/playwright-core/browsers.json', 'utf8'))
            .browsers.find(browser => browser.name === 'webkit');
          assert.equal(webkit.revision, '2359');
          const run = process.env.GITHUB_RUN_ID;
          const attempt = process.env.GITHUB_RUN_ATTEMPT;
          assert.match(run ?? '', /^[0-9]{1,20}$/);
          assert.equal(attempt, '1');
          const head = checkedGit('rev-parse', 'HEAD'), tree = checkedGit('rev-parse', 'HEAD^{tree}');
          assert.match(head, /^[0-9a-f]{40}$/);
          assert.match(tree, /^[0-9a-f]{40}$/);
          console.log('linux-wire-probe-runtime', JSON.stringify({
            platform: process.platform, arch: process.arch, node: process.version,
            playwright: version, browserRevision: webkit.revision, executable: browserType.executablePath(),
            head, tree, run, attempt,
          }));
          await requireClosed(5181);
          await requireClosed(5297);
          const listed = spawnSync('timeout', ['--signal=INT', '--kill-after=5s', '15s',
            process.execPath, cli, ...args, '--list', '--reporter=json'],
            { encoding: 'utf8', maxBuffer: 131072, stdio: ['ignore', 'pipe', 'pipe'] });
          assert.equal(listed.error, undefined);
          assert.equal(listed.signal, null);
          assert.equal(listed.status, 0, 'Probe discovery failed; no cases started.');
          assert.equal(listed.stderr, '');
          validateSelection(JSON.parse(listed.stdout));
          console.log('linux-wire-probe-selection', JSON.stringify({ project: 'webkit-photo',
            file: 'ai-photo-first.spec.ts', cases: names, retries: 0, workers: 2 }));
          await requireClosed(5181);
          await requireClosed(5297);
          const runSeconds = Math.min(130, Math.floor((165000 - (Date.now() - started) - 15000) / 1000));
          assert.ok(runSeconds > 0, 'Probe setup exhausted its time budget.');
          let result;
          try {
            result = spawnSync('timeout', ['--signal=INT', '--kill-after=10s', `${runSeconds}s`,
              process.execPath, cli, ...args], { stdio: 'inherit' });
          } finally {
            await requireClosed(5181);
            await requireClosed(5297);
          }
          assert.equal(result.error, undefined);
          assert.equal(result.signal, null);
          console.log('linux-wire-probe-exit', JSON.stringify({ code: result.status,
            portsClosed: true, inconclusive: [124, 130, 137].includes(result.status) }));
          assert.equal(result.status, 0, 'Probe failed or timed out; no replacement run is authorized.');
          NODE

  database:
    name: Real local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALLOW_SECURITY_TESTS: '1'
      ALLOW_CI_STORAGE_GUARD_INSTALL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run db:start
      - run: npm run db:rehearse
        env:
          ALLOW_PRESERVATION_REHEARSAL: '1'
      - run: npm run db:reset
      - run: npm run test:integration
      - run: npm run test:security
      - run: node scripts/ai-analysis-rehearsal.mjs
      - run: npm run db:types
      - name: Preserve generated schema types, never account fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-types
          path: src/data/database.types.ts
          if-no-files-found: error
          retention-days: 1
      - name: Require the generated types to match the repository
        run: |
          git ls-files --error-unmatch src/data/database.types.ts
          git diff --exit-code -- src/data/database.types.ts
