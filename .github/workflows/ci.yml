  webkit-photo:
    name: WebKit photo contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --project=webkit-photo

  database:
    name: Real local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALLOW_SECURITY_TESTS: '1'
      ALLOW_CI_DATABASE_MUTATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Pull the pg-meta image used by type generation (ECR, then pinned GHCR mirror)
        shell: bash -eo pipefail {0}
        run: |
          test -z "${SUPABASE_ENV:-}"
          test ! -e supabase/.env.development.local
          test ! -e supabase/.env.local
          test ! -e supabase/.env.development
          test ! -e supabase/.env
          test ! -e .env.development.local
          test ! -e .env.local
          test ! -e .env.development
          test ! -e .env
          test ! -e supabase/.temp/pgmeta-version
          image=public.ecr.aws/supabase/postgres-meta:v0.98.0
          digest=sha256:cef71ba901751dcc242cc685cf13786935ea8926820fb342f23bb0fbef77de5a
          mirror=ghcr.io/supabase/postgres-meta@$digest
          if docker pull "$image"; then
            expected="public.ecr.aws/supabase/postgres-meta@$digest"
          else
            echo "::warning title=pg-meta recovered from GHCR::ECR pull failed. Pulling the GHCR mirror once by pinned digest; a pass proves image availability only."
            docker pull "$mirror"
            docker tag "$mirror" "$image"
            expected="$mirror"
          fi
          digests="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image")"
          grep -Fqx "$expected" <<< "$digests"
          echo "pg-meta verified: $expected"
      - run: npm run db:start
      - run: npm run db:rehearse
        env:
          ALLOW_PRESERVATION_REHEARSAL: '1'
      - run: npm run db:reset
      - run: npm run test:integration
      - run: npm run test:security
      - run: node scripts/ai-analysis-rehearsal.mjs
      - run: npm run db:types
      - name: Preserve generated schema types, never account fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-types
          path: src/data/database.types.ts
          if-no-files-found: error
          retention-days: 1
      - name: Require the generated types to match the repository
        run: |
          git ls-files --error-unmatch src/data/database.types.ts
          git diff --exit-code -- src/data/database.types.ts
