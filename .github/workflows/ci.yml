          retention-days: 1

      - name: Preserve bounded synthetic I11 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i11-outfits-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i11-visual/list-en-desktop.png
            test-results/i11-visual/editor-en-desktop.png
            test-results/i11-visual/detail-en-desktop.png
            test-results/i11-visual/list-fi-mobile.png
            test-results/i11-visual/editor-fi-mobile.png
            test-results/i11-visual/detail-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I15 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i15-today-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i15-visual/ideas-en-desktop.png
            test-results/i15-visual/missing-en-desktop.png
            test-results/i15-visual/ideas-fi-mobile.png
            test-results/i15-visual/missing-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I16 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i16-weather-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i16-visual/settings-en-desktop.png
            test-results/i16-visual/settings-fi-mobile.png
            test-results/i16-visual/today-forecast-en-desktop.png
            test-results/i16-visual/today-unavailable-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic P6a visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6a-backup-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
