name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:translations
      - run: npm run test:unit
      - name: Set a build-only secret canary
        run: echo "STILLROOM_SECRET_CANARY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run scan:secrets
      - run: npm run check:dependencies
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Preserve bounded synthetic I06 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i06-profile-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i06-visual/profile-en-desktop.png
            test-results/i06-visual/profile-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I07 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i07-capture-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i07-visual/crop-en-desktop.png
            test-results/i07-visual/crop-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I29b visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i29b-item-details-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i29b-visual/item-details-en-desktop.png
            test-results/i29b-visual/item-details-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I29c visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i29c-garment-fields-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i29c-visual/garment-fields-en-desktop.png
            test-results/i29c-visual/garment-fields-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I29 photo-first C visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i29-photo-first-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i29-photo-first-visual/consent-en-desktop.png
            test-results/i29-photo-first-visual/consent-fi-mobile.png
            test-results/i29-photo-first-visual/analyzed-draft-en-desktop.png
            test-results/i29-photo-first-visual/analyzed-draft-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic UX L1a visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-l1a-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/ux-l1a-visual/add-ready-en-desktop.png
            test-results/ux-l1a-visual/add-ready-fi-mobile.png
            test-results/ux-l1a-visual/add-failed-en-desktop.png
            test-results/ux-l1a-visual/add-failed-fi-mobile.png
            test-results/ux-l1a-visual/more-details-en-desktop.png
            test-results/ux-l1a-visual/more-details-fi-mobile.png
            test-results/ux-l1a-visual/saved-item-en-desktop.png
            test-results/ux-l1a-visual/saved-item-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic UX L1b visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-l1b-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/ux-l1b-visual/crop-en-desktop.png
            test-results/ux-l1b-visual/crop-fi-mobile.png
            test-results/ux-l1b-visual/crop-exact-en-desktop.png
            test-results/ux-l1b-visual/crop-exact-fi-mobile.png
            test-results/ux-l1b-visual/photo-actions-en-desktop.png
            test-results/ux-l1b-visual/photo-actions-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic UX L2a visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-l2a-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/ux-l2a-visual/settings-off-en-desktop.png
            test-results/ux-l2a-visual/settings-off-fi-mobile.png
            test-results/ux-l2a-visual/settings-details-en-desktop.png
            test-results/ux-l2a-visual/settings-details-fi-mobile.png
            test-results/ux-l2a-visual/settings-on-en-desktop.png
            test-results/ux-l2a-visual/settings-on-fi-mobile.png
            test-results/ux-l2a-visual/settings-unavailable-en-desktop.png
            test-results/ux-l2a-visual/settings-unavailable-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic UX-copy visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-copy-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/ux-copy-visual/sign-in-en-desktop.png
            test-results/ux-copy-visual/sign-in-fi-mobile.png
            test-results/ux-copy-visual/recovery-en-desktop.png
            test-results/ux-copy-visual/recovery-fi-mobile.png
            test-results/ux-copy-visual/wardrobe-empty-en-desktop.png
            test-results/ux-copy-visual/wardrobe-empty-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I08 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i08-item-lifecycle-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i08-visual/trash-en-desktop.png
            test-results/i08-visual/trash-fi-mobile.png
            test-results/i08-visual/delete-en-desktop.png
            test-results/i08-visual/delete-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I09 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i09-wardrobe-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i09-visual/wardrobe-grid-en-desktop.png
            test-results/i09-visual/wardrobe-filters-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I10b visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i10b-image-lifecycle-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i10b-visual/replacement-en-desktop.png
            test-results/i10b-visual/recovery-fi-mobile.png
            test-results/i10b-visual/deletion-resume-sv-mobile.png
          if-no-files-found: error
          retention-days: 1

  database:
    name: Real local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALLOW_SECURITY_TESTS: '1'
      ALLOW_CI_DATABASE_MUTATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Pull the pg-meta image used by type generation (single attempt)
        run: |
          test -z "${SUPABASE_ENV:-}"
          test ! -e supabase/.env.development.local
          test ! -e supabase/.env.local
          test ! -e supabase/.env.development
          test ! -e supabase/.env
          test ! -e .env.development.local
          test ! -e .env.local
          test ! -e .env.development
          test ! -e .env
          test ! -e supabase/.temp/pgmeta-version
          docker pull public.ecr.aws/supabase/postgres-meta:v0.98.0
      - run: npm run db:start
      - run: npm run db:rehearse
        env:
          ALLOW_PRESERVATION_REHEARSAL: '1'
      - run: npm run db:reset
      - run: npm run test:integration
      - run: npm run test:security
      - run: node scripts/ai-analysis-rehearsal.mjs
      - run: npm run db:types
      - name: Preserve generated schema types, never account fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-types
          path: src/data/database.types.ts
          if-no-files-found: error
          retention-days: 1
      - name: Require the generated types to match the repository
        run: |
          git ls-files --error-unmatch src/data/database.types.ts
          git diff --exit-code -- src/data/database.types.ts
