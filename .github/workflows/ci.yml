name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:translations
      - run: npm run test:unit
      - name: Set a build-only secret canary
        run: echo "STILLROOM_SECRET_CANARY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run scan:secrets
      - run: npm run check:dependencies
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=chromium --project=mobile
      - name: Preserve bounded synthetic I06 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i06-profile-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i06-visual/profile-en-desktop.png
            test-results/i06-visual/profile-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I07 visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i07-capture-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i07-visual/crop-en-desktop.png
            test-results/i07-visual/crop-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I29b visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i29b-item-details-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i29b-visual/item-details-en-desktop.png
            test-results/i29b-visual/item-details-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I29c visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i29c-garment-fields-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i29c-visual/garment-fields-en-desktop.png
            test-results/i29c-visual/garment-fields-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic I29 photo-first C visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i29-photo-first-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/i29-photo-first-visual/consent-en-desktop.png
            test-results/i29-photo-first-visual/consent-fi-mobile.png
            test-results/i29-photo-first-visual/analyzed-draft-en-desktop.png
            test-results/i29-photo-first-visual/analyzed-draft-fi-mobile.png
          if-no-files-found: error
          retention-days: 1

      - name: Preserve bounded synthetic UX L1a visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-l1a-ui-${{ github.event.pull_request.head.sha || github.sha }}
